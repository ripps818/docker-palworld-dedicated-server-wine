networks:
  palworld:

services:
  palworld-dedicated-server:
    container_name: palworld-wine-server
    image: ghcr.io/ripps818/docker-palworld-dedicated-server-wine:latest
    restart: unless-stopped
    # Only needed if AUTO_PAUSE_ENABLED=true - lets iptables install the
    # NFLOG wake-on-connect rule.
    # cap_add:
    #   - NET_ADMIN
    # Gives a graceful shutdown room to finish before Docker SIGKILLs it.
    stop_grace_period: 30s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - target: 8211 # Gamerserver port inside of the container
        published: 8211 # Gamerserver port on your host
        protocol: udp
        mode: host
      - target: 8212 # Gameserver API port inside of the container
        published: 8212 # Gameserver API port on your host
        protocol: tcp
        mode: host
      - target: 25575 # RCON port inside of the container
        published: 25575 # RCON port on your host
        protocol: tcp
        mode: host
      - target: 27015 # Query port inside of the container
        published: 27015 # Query port on your host
        protocol: tcp
    env_file:
      - ./default.env
    environment:
      # Read-only view of the companion's data dir - settings-overrides.env
      # written by the web panel is applied from there at boot
      COMPANION_DATA_DIR: /companion-data
    volumes:
      - ./game:/palworld
      - ./companion:/companion-data:ro
    networks:
      - palworld

  # Companion sidecar: web operation panel + Discord status card & bot.
  # Disabled by default - it idles until you enable PANEL_ENABLED and/or
  # DISCORD_STATUS_ENABLED in default.env (ALL companion variables live there,
  # in the "Companion-sidecar-settings" section).
  # Docs: https://github.com/jammsen/docker-palworld-companion
  companion:
    container_name: palworld-companion
    # develop tag during the testing grace period - switches to latest with
    # the companion's first stable release
    image: jammsen/palworld-companion:develop
    restart: unless-stopped
    depends_on:
      - palworld-dedicated-server
    ports:
      # (Needs: PANEL_ENABLED=true)
      # Warning! DO NOT expose this port to the internet, use a reverse proxy or VPN/LAN only
      - target: 8213 # Web panel port inside of the container
        published: 8213 # Web panel port on your host
        protocol: tcp
        mode: host
    env_file:
      - ./default.env
    environment:
      RESTAPI_HOST: palworld-wine-server
      COMPANION_DATA_DIR: /data
      # Point companion directly to the Wine server's config location
      GAME_SETTINGS_FILE: /palworld/Pal/Saved/Config/WindowsServer/PalWorldSettings.ini
    volumes:
      - ./game:/palworld:ro
      - ./companion:/data
    networks:
      - palworld
