---
name: unit-test-component-run-on-pr
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (optional, leave empty to test current branch/PR)'
        required: false
        default: ''
      test_workshop_mod_id:
        description: 'Steam Workshop Mod ID to test download/install (optional, e.g. 3767620647)'
        required: false
        default: ''
  pull_request: # Run tests on all pull requests, except those only touching CI/config files
    paths-ignore:
      - '.github/**'

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  unit-test-amd64:
    name: Docker - Test Linux-amd64 image
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Get Runner Info
        run: |
          id
          pwd
          git --version
          docker version
          free -m
          cat /proc/cpuinfo | grep "model name"
          echo "Repository value of TIMEOUT_SECONDS is: ${{ vars.TIMEOUT_SECONDS }}"
          echo "This should not be set on a PR from a different source!"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          load: true
          tags: ${{ github.run_id }}
          platforms: linux/amd64

      - name: Test Mod Installation Pipeline
        run: |
          echo ">>> Creating test mod structures..."
          mkdir -p ./game/Mods/NativeMods/TestLuaMod/scripts
          cat << 'EOF' > ./game/Mods/NativeMods/TestLuaMod/scripts/main.lua
          print("[UnitTestMod] UE4SS Test Mod Initialized Successfully!")
          EOF
          cat << 'EOF' > ./game/Mods/NativeMods/TestLuaMod/Info.json
          {
            "Name": "TestLuaMod",
            "Version": "1.0.0"
          }
          EOF

          mkdir -p ./game/Mods/NativeMods/TestPakMod
          touch ./game/Mods/NativeMods/TestPakMod/TestPakMod_P.pak

          mkdir -p ./game/Mods/NativeMods/TestTildePakMod/~mods
          touch ./game/Mods/NativeMods/TestTildePakMod/~mods/TestTildePakMod_P.pak

          mkdir -p ./game/Mods/NativeMods/TestPalSchemaMod/PalSchema/mods/TestPalSchemaSubMod
          echo '{"name": "TestPalSchemaSubMod"}' > ./game/Mods/NativeMods/TestPalSchemaMod/PalSchema/mods/TestPalSchemaSubMod/schema.json

          mkdir -p ./game/Mods/ConfigOverrides/TestLuaMod
          echo "enabled = true" > ./game/Mods/ConfigOverrides/TestLuaMod/config.ini

          echo ">>> Running install-mods.sh in test container..."
          docker run --rm \
            -e INSTALL_UE4SS_EXPERIMENTAL=true \
            -e WORKSHOP_MODS_DEBUG=true \
            -e WORKSHOP_MOD_IDS="${{ inputs.test_workshop_mod_id }}" \
            -v "$(pwd)/game:/palworld" \
            ${{ github.run_id }} \
            /scripts/install-mods.sh

          echo ">>> Verifying file deployments..."
          # 1. UE4SS framework files
          if [[ ! -f ./game/Pal/Binaries/Win64/dwmapi.dll ]] && [[ ! -f ./game/Pal/Binaries/Win64/UE4SS.dll ]] && [[ ! -f ./game/Pal/Binaries/Win64/ue4ss/UE4SS.dll ]]; then
            echo "Error: UE4SS binaries were not deployed!"
            exit 1
          fi

          # 2. Lua Mod deployment
          if [[ ! -f ./game/Pal/Binaries/Win64/Mods/TestLuaMod/scripts/main.lua ]] && [[ ! -f ./game/Pal/Binaries/Win64/ue4ss/Mods/TestLuaMod/scripts/main.lua ]]; then
            echo "Error: TestLuaMod scripts were not deployed!"
            exit 1
          fi

          # 3. Pak LogicMod and ~mods deployment
          if [[ ! -f ./game/Pal/Content/Paks/LogicMods/TestPakMod_P.pak ]]; then
            echo "Error: TestPakMod_P.pak was not deployed to LogicMods!"
            exit 1
          fi

          if [[ ! -f ./game/Pal/Content/Paks/~mods/TestTildePakMod_P.pak ]]; then
            echo "Error: TestTildePakMod_P.pak was not deployed to ~mods!"
            exit 1
          fi

          # 4. PalSchema Mod deployment
          if [[ ! -d ./game/Pal/Binaries/Win64/Mods/PalSchema/mods/TestPalSchemaSubMod ]] && [[ ! -d ./game/Pal/Binaries/Win64/ue4ss/Mods/PalSchema/mods/TestPalSchemaSubMod ]]; then
            echo "Error: PalSchema sub-mod was not deployed!"
            exit 1
          fi

          # 5. Config Override deployment
          if [[ ! -f ./game/Pal/Binaries/Win64/Mods/TestLuaMod/config.ini ]] && [[ ! -f ./game/Pal/Binaries/Win64/ue4ss/Mods/TestLuaMod/config.ini ]]; then
            echo "Error: Config override config.ini was not deployed!"
            exit 1
          fi

          # 6. Registration in PalModSettings.ini or mods.txt
          MODS_INI=$(find ./game/Pal/Binaries/Win64 -name "PalModSettings.ini" -o -name "mods.txt" | head -n 1)
          if [[ -n "$MODS_INI" ]] && grep -q "TestLuaMod" "$MODS_INI"; then
            echo "Success: TestLuaMod registered in $(basename "$MODS_INI")"
          fi

          echo ">>> Testing mod removal and cleanup state..."
          sudo rm -rf ./game/Mods/NativeMods/TestPakMod
          sudo rm -rf ./game/Mods/NativeMods/TestTildePakMod
          sudo rm -rf ./game/Mods/NativeMods/TestPalSchemaMod

          docker run --rm \
            -e INSTALL_UE4SS_EXPERIMENTAL=true \
            -e WORKSHOP_MODS_DEBUG=true \
            -e WORKSHOP_MOD_IDS="${{ inputs.test_workshop_mod_id }}" \
            -v "$(pwd)/game:/palworld" \
            ${{ github.run_id }} \
            /scripts/install-mods.sh

          if [[ -f ./game/Pal/Content/Paks/LogicMods/TestPakMod_P.pak ]]; then
            echo "Error: TestPakMod_P.pak was not cleaned up after removal!"
            exit 1
          fi

          if [[ -f ./game/Pal/Content/Paks/~mods/TestTildePakMod_P.pak ]]; then
            echo "Error: TestTildePakMod_P.pak was not cleaned up after removal!"
            exit 1
          fi

          echo ">>> Cleaning test fixtures before main server boot..."
          sudo rm -rf ./game/Mods/NativeMods/TestLuaMod
          sudo rm -rf ./game/Mods/ConfigOverrides/TestLuaMod

          echo ">>> Mod installation pipeline unit tests passed successfully!"

      - name: Run server
        run: |
          docker run -d \
          --name palworld-dedicated-server \
          -p 8211:8211/udp \
          -p 8212:8212/tcp \
          -p 25575:25575/tcp \
          -e PUID=7351 \
          -e PGID=2431 \
          -e ADMIN_PASSWORD=123 \
          -e SERVER_PASSWORD=456 \
          -e SERVER_SETTINGS_MODE=auto \
          -e INSTALL_UE4SS_EXPERIMENTAL=true \
          -e WORKSHOP_MODS_DEBUG=true \
          -e WORKSHOP_MOD_IDS="${{ inputs.test_workshop_mod_id }}" \
          -v ./game:/palworld/ \
          --restart unless-stopped \
          --stop-timeout 30 \
          ${{ github.run_id }}

      - name: Wait for server to start
        run: |
          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=${{ vars.TIMEOUT_SECONDS || '300' }}
          echo "TIMEOUT_SECONDS: $TIMEOUT_SECONDS"

          # Set the timezone to Germany (Central European Time)
          export TZ=Europe/Berlin

          # Source color functions
          source ./includes/colors.sh
          
          # Track last log position to avoid duplicate output
          LAST_LOG_LINES=0

          while ! docker logs palworld-dedicated-server 2>&1 | grep -q "Setting breakpad minidump AppID"; do
            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED_TIME -gt $TIMEOUT_SECONDS ]; then
              echo "Timeout reached. Server failed to start within $TIMEOUT_SECONDS seconds."
              es "*****Final Container LOGS*****"
              docker logs palworld-dedicated-server
              exit 1
            fi

            # Show current status with warning color
            ew ">>> $(date '+%H:%M:%S') - Waiting for server to start... (${ELAPSED_TIME}s elapsed)"            
            # Get current log lines count and show new logs if any
            CURRENT_LOG_LINES=$(docker logs palworld-dedicated-server 2>&1 | wc -l)
            if [ $CURRENT_LOG_LINES -gt $LAST_LOG_LINES ]; then
              es ">>> Recent container logs"
              es "╭─────────────────────────────────────────────────────────────────────────────────────────────────────╮"
              docker logs palworld-dedicated-server 2>&1 | tail -n +$((LAST_LOG_LINES + 1)) | head -n $((CURRENT_LOG_LINES - LAST_LOG_LINES))
              es "╰─────────────────────────────────────────────────────────────────────────────────────────────────────╯"
              LAST_LOG_LINES=$CURRENT_LOG_LINES
            fi
            
            echo "---"
            sleep 5
          done
          
          echo "Server successfully started in $ELAPSED_TIME seconds"
          es "*****Final Container LOGS*****"
          docker logs palworld-dedicated-server

      - name: Verify UE4SS initialization and mod loading
        run: |
          echo ">>> Checking for UE4SS log file..."
          UE4SS_LOG=$(find ./game/Pal/Binaries/Win64 -name "UE4SS.log" 2>/dev/null | head -n 1)
          if [[ -f "$UE4SS_LOG" ]]; then
            echo "=== UE4SS.log Content ==="
            cat "$UE4SS_LOG"
            echo "========================="
            if grep -q "TestLuaMod" "$UE4SS_LOG" || grep -q "UnitTestMod" "$UE4SS_LOG"; then
              echo "SUCCESS: UE4SS loaded TestLuaMod successfully!"
            else
              echo "INFO: UE4SS log found, mod loader initialized."
            fi
          else
            echo "INFO: Server started; checking for UE4SS runtime logs."
          fi

      - name: Test if port 8766, 27015 and 27016 are listening
        run: |
          nc -z -u -v 127.0.0.1 8211 || exit 2
          nc -z -v 127.0.0.1 8212 || exit 3
          nc -z -v 127.0.0.1 25575 || exit 4

      - name: Stop server
        if: always()
        run: |
          docker stop palworld-dedicated-server || true
          docker rm palworld-dedicated-server || true
          docker rmi ${{ github.run_id }} || true
